<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse the complete application source and runtime assets behind the Avara3D live demo.">
    <title>Demo Source · Avara3D</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/prism.css">
    <link rel="stylesheet" href="assets/css/source-browser.css">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <script src="assets/js/site.js" defer></script>
    <script src="assets/vendor/prism/prism-cpp.min.js" defer></script>
    <script src="assets/vendor/prism/prism-json.min.js" defer></script>
    <script src="assets/js/source-browser.js" defer></script>
</head>
<body>
<div class="site-shell">
    <header class="site-header">
        <div class="site-width header-inner">
            <a class="site-brand" href="index.html" aria-label="Avara3D home">
                <img class="site-logo" src="assets/images/avara3d.svg" alt="Avara3D">
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
                <span class="sr-only">Toggle navigation</span><span></span><span></span>
            </button>
            <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-nav>
                <a href="architecture.html">Architecture</a>
                <a href="demo_source.html" aria-current="page">Demo Source</a>
                <a href="api/">API</a>
                <a href="downloads.html">Downloads</a>
                <a class="external-link"
                   href="http://gitlab.mkd.net/a3d/avara3d"
                   target="_blank"
                   rel="noopener noreferrer">GitLab <span aria-hidden="true">↗</span></a>
            </nav>
        </div>
    </header>

    <main class="site-width inner-page">
        <header class="page-hero page-hero-compact demo-source-hero">
            <h1>The code behind the demo.</h1>
            <p>The complete demo application, from setup through simulation.</p>
        </header>

        <section class="source-browser" data-source-browser aria-label="Demo source browser">
            <aside class="source-file-list" aria-label="Demo files">
                <div class="source-list-heading">
                    <p class="panel-label">Files</p>
                    <span data-source-directory>janus</span>
                </div>
                <div class="source-directory-list" data-source-directory-list aria-label="Current directory">
                    <div class="source-list-empty">Loading files…</div>
                </div>
                <a class="source-repository-link external-link"
                   href="https://gitlab.mkd.net/a3d/avara3d"
                   data-source-repository-link
                   target="_blank"
                   rel="noopener noreferrer">View in GitLab<span aria-hidden="true">↗</span></a>
            </aside>

            <div class="source-view">
                <header class="source-view-header">
                    <div>
                        <span class="source-language" data-source-language>C++</span>
                        <strong data-source-title>main.cc</strong>
                    </div>
                    <span data-source-path>demos/janus/main.cc</span>
                </header>
                <div class="source-code"
                     data-source-content
                     data-preview-kind="loading"
                     role="region"
                     aria-label="Loading file preview"
                     tabindex="0">
                    <div class="source-loading">Loading file…</div>
                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="site-width footer-inner">
            <p>
                Avara3D<span class="footer-desktop-only"> · 3D visualization and simulation</span>
            </p>
            <p>
                <span class="footer-desktop-only">Copyright </span>© <span data-current-year></span>
                <a href="https://mkd.net/"
                   target="_blank"
                   rel="noopener noreferrer">Morgan Davis</a>
            </p>
        </div>
    </footer>
</div>
</body>
</html>
