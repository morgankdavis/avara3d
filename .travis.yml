language: cpp
#compiler: clang
#branches:
#    only:
#        - ci
#        - master
sudo: false
dist: trusty
addons:
    apt:
        packages:
#apt-get install -y build-essential cmake libgl1-mesa-dev libglu1-mesa-dev libxi-dev zlib1g-dev libxrandr-dev libxinerama-dev libxcursor-dev

            - cmake
            - libxrandr-dev
            - libxinerama-dev
            - libxcursor-dev
            - libxi-dev
	    - libgl1-mesa-dev
	    - libglu1-mesa-dev
	    - zlib1g-dev
matrix:
    include:
        - os: linux
          env:
              - BUILD_SHARED_LIBS=ON
              - CFLAGS=-Werror
        - os: linux
          env:
              - BUILD_SHARED_LIBS=OFF
              - CFLAGS=-Werror
        - os: linux
          sudo: required
          addons:
              apt:
                  packages:
                      - libwayland-dev
                      - libxkbcommon-dev
                      - libegl1-mesa-dev
          env:
              - USE_WAYLAND=ON
              - BUILD_SHARED_LIBS=ON
              - CFLAGS=-Werror
        - os: linux
          sudo: required
          addons:
              apt:
                  packages:
                      - libwayland-dev
                      - libxkbcommon-dev
                      - libegl1-mesa-dev
          env:
              - USE_WAYLAND=ON
              - BUILD_SHARED_LIBS=OFF
              - CFLAGS=-Werror
        - os: osx
          env:
              - BUILD_SHARED_LIBS=ON
              - CFLAGS=-Werror
        - os: osx
          env:
              - BUILD_SHARED_LIBS=OFF
              - CFLAGS=-Werror
script:
    #- if grep -Inr '\s$' src include docs tests examples CMake *.md .gitattributes .gitignore; then echo Trailing whitespace found, aborting.; exit 1; fi
    - mkdir build
    - cd build
    #- if test -n "${USE_WAYLAND}";
    #      then wget https://mirrors.kernel.org/ubuntu/pool/universe/e/extra-cmake-modules/extra-cmake-modules_5.38.0a-0ubuntu1_amd64.deb;
    #      sudo dpkg -i extra-cmake-modules_5.38.0a-0ubuntu1_amd64.deb;
    #      git clone git://anongit.freedesktop.org/wayland/wayland-protocols;
    #      pushd wayland-protocols;
    #      git checkout 1.12 && ./autogen.sh --prefix=/usr && make && sudo make install;
    #      popd;
    #  fi
    - cmake ..
    - cmake --build .
notifications:
    email:
        recipients:
            - m@goosesensor.net
    on_success: always
    on_failure: always
