<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>A3D Python</title>

	<style>
		body {
			background: #202020;
			color: white;
			font-family: sans-serif;
		}

		canvas {
			border: 1px solid #808080;
		}
	</style>
</head>

<body>
	<canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>
	<p id="status">Loading Pyodide…</p>

	<script type="module">
		import {loadPyodide} from
			"../../external/pyodide-314.0.7/dist/pyodide.mjs";

		const status = document.querySelector("#status");

		const resourcePaths = [
			"fonts/Neuropol Nova Xp.ttf",
			"fonts/SourceCodePro-Semibold.otf",
			"shaders/default.frag",
			"shaders/default.vert",
			"shaders/ground.frag",
			"shaders/ground.vert",
			"shaders/include/atmosphere.glsl",
			"shaders/include/environment.glsl",
			"shaders/include/fog.glsl",
			"shaders/include/lighting.glsl",
			"shaders/include/material.glsl",
			"shaders/lines.frag",
			"shaders/lines.vert",
			"shaders/skybox.frag",
			"shaders/skybox.vert",
			"shaders/wireframe.frag",
			"shaders/wireframe.vert",
		];

		async function fetchRequired(url) {
			const response = await fetch(url);

			if (!response.ok) {
				throw new Error(`Failed to fetch ${url}: ${response.status}`);
			}

			return response;
		}

		try {
			const pyodideDirectory =
				new URL("../../external/pyodide-314.0.7/dist/", import.meta.url).href;

			const wheel =
				new URL(
					"../../../dist/avara3d-0.3.0-cp314-cp314-pyemscripten_2026_0_wasm32.whl",
					import.meta.url
				).href;

			const script =
				new URL(
					"../../../tests/sandbox/rotating_cube.py",
					import.meta.url
				).href;

			const resourceDirectory =
				new URL("../../../../lib/data/", import.meta.url);

			const pyodide = await loadPyodide({
				indexURL: pyodideDirectory,
			});

			globalThis.pyodide = pyodide;

			pyodide.canvas.setCanvas3D(
				document.querySelector("#canvas")
			);

			status.textContent = "Loading Avara3D…";
			await pyodide.loadPackage(wheel);

			status.textContent = "Loading resources…";

			for (const resourcePath of resourcePaths) {
				const response =
					await fetchRequired(new URL(resourcePath, resourceDirectory));

				const destination = `/data/${resourcePath}`;

				pyodide.FS.mkdirTree(
					destination.substring(0, destination.lastIndexOf("/"))
				);

				pyodide.FS.writeFile(
					destination,
					new Uint8Array(await response.arrayBuffer())
				);
			}

			status.textContent = "Starting rotating cube…";

			const response = await fetchRequired(script);
			const source = await response.text();

			pyodide.globals.set("_a3d_source", source);

			await pyodide.runPythonAsync(`
try:
    exec(_a3d_source, {"__name__": "__main__"})
except SystemExit as error:
    if error.code not in (None, 0):
        raise
`);

			status.textContent = "Running.";
		} catch (error) {
			console.error(error);
			status.textContent = error.stack ?? String(error);
		}
	</script>
</body>

</html>
