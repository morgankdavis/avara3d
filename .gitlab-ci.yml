archive-linux:
  stage: archive
  tags:
    - ubuntu-23
  environment: production
  only:
   - testing
   - stable
  #dependencies:
  #  - build-linux
  script:
    - echo "Starting Linux archive..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /usr/bin/cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -G"Ninja"
      -DCMAKE_C_COMPILER=/usr/bin/clang
      -DCMAKE_CXX_COMPILER=/usr/bin/clang++
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /usr/bin/cmake --build . --target install -j4
    - /usr/bin/cmake
      -DCMAKE_BUILD_TYPE="Release"
      -G"Ninja"
      -DCMAKE_C_COMPILER=/usr/bin/clang
      -DCMAKE_CXX_COMPILER=/usr/bin/clang++
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /usr/bin/cmake --build . --target install -j4
    - echo "Linux archive complete."
  artifacts:
    name: "avara3d-linux-${CI_COMMIT_BRANCH}"
    expose_as: 'archive-linux'
    paths:
      - gitlab-build/packaged/avara3d
    expire_in: 1 month

