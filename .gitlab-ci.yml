stages:
  - build
  # https://hatchjs.com/gitlab-ci-artifacts-paths/
  #- archive

linux-debug:
  stage: build
  tags:
    - ubuntu-23
  except:
    - testing
    - stable
  script:
    - echo "Starting Linux debug build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /usr/bin/cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -G"Ninja"
      -DCMAKE_C_COMPILER=/usr/bin/clang
      -DCMAKE_CXX_COMPILER=/usr/bin/clang++
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /usr/bin/cmake --build . --target install -j4
    - mv packaged/avara3d ../
    - echo "Linux debug build complete."
  artifacts:
    name: "avara3d-linux-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    expose_as: "linux-debug"
    paths:
      - avara3d
    expire_in: 2 days

macos-debug:
  stage: build
  tags:
    - macos-12.6
  except:
    - testing
    - stable
  script:
    - echo "Starting macOS debug build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /opt/local/bin/cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -G"Ninja"
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /opt/local/bin/cmake --build . --target install -j4
    - mv packaged/avara3d ../
    - echo "macOS debug build complete."
  artifacts:
    name: "avara3d-macos-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    expose_as: "macos-debug"
    paths:
      - avara3d
    expire_in: 2 days

windows-debug:
  stage: build
  tags:
    - windows-10
  except:
    - testing
    - stable
  script:
    - echo "Starting Windows debug build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -T"ClangCL"
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - cmake --build . --config Debug --target install -j8
    - mv packaged/avara3d ../
    - echo "Windows debug build complete."
  artifacts:
    name: "avara3d-windows-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    expose_as: "windows-debug"
    paths:
      - avara3d
    expire_in: 2 days

linux-release:
  stage: build
  tags:
    - ubuntu-23
  environment: production
  only:
   - testing
   - stable
  when: manual
  #dependencies:
  #  - build-linux
