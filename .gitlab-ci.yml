.archive-debug-linux:
  stage: archive
  environment: production
  dependencies:
    - build-linux
  only:
   - testing
  tags:
    - ubuntu-23
  script:
    - echo "Starting Linux debug archive..."
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - gitlab-build/packaged/avara3d
    expose_as: 'avara3d-linux'
    expire_in: 1 month

archive-debug-macos:
  stage: archive
  environment: production
  dependencies:
    - build-macos
  only:
    - testing
  tags:
    - macos-12.6
  script:
    - echo "Starting macOS debug archive..."
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - gitlab-build/packaged/avara3d
    expose_as: 'avara3d-macos'
    expire_in: 1 month

archive-debug-windows:
  stage: archive
  environment: production
  dependencies:
    - build-macos
  only:
    - testing
  tags:
    - windows-10
  script:
    - echo "Starting Windows debug archive..."
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - gitlab-build/packaged/avara3d
    expose_as: 'avara3d-windows'
    expire_in: 1 month

