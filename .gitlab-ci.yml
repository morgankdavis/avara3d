stages:
    - build
    - deploy

variables:
  EMSDK_ROOT: "/home/gitlab/.emsdk-6.0.3"

linux-debug:
  stage: build
  tags:
    - ubuntu-23
  except:
    - testing
    - stable
  script:
    - echo "Starting Linux debug build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /usr/bin/cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -DA3D_BUILD_AUTOMATED_TESTS=ON
      -DA3D_BUILD_SANDBOX_TESTS=ON
      -G"Ninja"
      -DCMAKE_C_COMPILER=/usr/bin/clang
      -DCMAKE_CXX_COMPILER=/usr/bin/clang++
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /usr/bin/cmake --build . --target install -j4
    - /usr/bin/cmake --build . --target a3d-tests -j4
    - /usr/bin/ctest --output-on-failure
    - mv packaged/avara3d ../
    - echo "Linux debug build complete."
  artifacts:
    name: "avara3d-linux-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    expose_as: "linux-debug"
    paths:
      - avara3d
    expire_in: 2 days

macos-debug:
  stage: build
  tags:
    - macos-15
  except:
    - testing
    - stable
  script:
    - echo "Starting macOS debug build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /usr/local/bin/cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -DA3D_BUILD_AUTOMATED_TESTS=OFF
      -DA3D_BUILD_SANDBOX_TESTS=ON
      -DA3D_MACOS_UNIVERSAL=ON
      -G"Ninja"
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /usr/local/bin/cmake --build . --target install -j4
    - mv packaged/avara3d ../
    - cd ..
    - mkdir gitlab-build-tests
    - cd gitlab-build-tests
    - /usr/local/bin/cmake
      -DCMAKE_BUILD_TYPE="Debug"
      -DA3D_BUILD_AUTOMATED_TESTS=ON
      -DA3D_BUILD_SANDBOX_TESTS=OFF
      -DA3D_BUILD_EDITOR=OFF
      -DA3D_BUILD_DEMOS=OFF
      -DA3D_BUILD_DOCUMENTATION=OFF
      -G"Ninja"
      ..
    - /usr/local/bin/cmake --build . --target a3d-tests -j4
    - /usr/local/bin/ctest --output-on-failure
    - cd ..
    - echo "macOS debug build complete."
  artifacts:
    name: "avara3d-macos-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    expose_as: "macos-debug"
    paths:
      - avara3d
    expire_in: 2 days

windows-debug:
  stage: build
  tags:
    - windows-10
  except:
    - testing
    - stable
  script:
    - echo "Starting Windows debug build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - cmake
      -DCMAKE_PREFIX_PATH="C:/Qt/6.10.1/msvc2022_64;C:/Users/gitlab/vcpkg/installed/x64-windows"
      -DCMAKE_BUILD_TYPE="Debug"
      -DA3D_BUILD_AUTOMATED_TESTS=ON
      -DA3D_BUILD_SANDBOX_TESTS=ON
      -T"ClangCL"
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - cmake --build . --config Debug --target install --parallel 8
    - cmake --build . --config Debug --target a3d-tests --parallel 8
    - ctest -C Debug --output-on-failure
    - mv packaged/avara3d ../
    - echo "Windows debug build complete."
  artifacts:
    name: "avara3d-windows-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
    expose_as: "windows-debug"
    paths:
      - avara3d
    expire_in: 2 days

web-debug:
    stage: build
    tags:
      - ubuntu-23
    except:
      - testing
      - stable
    script:
      - echo "Starting Web debug build..."
      - source "${EMSDK_ROOT}/emsdk_env.sh"
      - export EM_CACHE="/home/gitlab-runner/.cache/emscripten-6.0.3"
      - emcc --version
      - mkdir gitlab-build
      - cd gitlab-build
      - emcmake /usr/bin/cmake
        -DCMAKE_BUILD_TYPE="Debug"
        -DA3D_BUILD_EDITOR=OFF
        -DA3D_BUILD_AUTOMATED_TESTS=OFF
        -DA3D_BUILD_SANDBOX_TESTS=ON
        -DA3D_BUILD_DEMOS=ON
        -DA3D_BUILD_DOCUMENTATION=OFF
        -DA3D_WEB_GENERATE_HTML=ON
        -G"Ninja"
        -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
        -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
        ..
      - /usr/bin/cmake --build . --target install -j4
      - mv packaged/avara3d ../
      - echo "Web debug build complete."
    artifacts:
      name: "avara3d-web-debug-${CI_COMMIT_BRANCH}-${CI_PIPELINE_IID}"
      expose_as: "web-debug"
      paths:
        - avara3d
