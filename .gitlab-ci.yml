staging-publish-test:
    stage: deploy
    tags:
        - ubuntu-23
    needs: []
    rules:
        - if: '$CI_COMMIT_BRANCH == "website"'
          when: manual
        - when: never
    allow_failure: true
    script:
        - |
          set -euo pipefail

          echo "Testing GitLab CI SSH connection to staging..."

          test -f "${SSH_PRIVATE_KEY}"
          test -f "${SSH_KNOWN_HOSTS}"

          chmod 600 "${SSH_PRIVATE_KEY}"
          chmod 644 "${SSH_KNOWN_HOSTS}"

          ssh \
              -i "${SSH_PRIVATE_KEY}" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${SSH_KNOWN_HOSTS}" \
              "${A3D_DEPLOY_USER}@${A3D_DEPLOY_HOST}" \
              "id &&
               test -w '${A3D_DEPLOY_PATH}' &&
               touch '${A3D_DEPLOY_PATH}/.gitlab-ci-test' &&
               rm '${A3D_DEPLOY_PATH}/.gitlab-ci-test' &&
               echo 'GitLab CI staging SSH test passed.'"
