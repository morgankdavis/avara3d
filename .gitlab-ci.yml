stages:
  - build
  #- test
  # https://hatchjs.com/gitlab-ci-artifacts-paths/
  - archive

variables:
  dummy_var: "$CI_PROJECT_DIR/dummy" 

build-linux:
  stage: build
  tags:
    - ubuntu-23
  artifacts:
    paths:
      - gitlab-build/packaged
    expire_in: 5 minutes
  script:
    - echo "Starting Linux build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /usr/bin/cmake
      -G"Ninja"
      -DCMAKE_C_COMPILER=/usr/bin/clang
      -DCMAKE_CXX_COMPILER=/usr/bin/clang++
      -DA3D_BUILD_BULLET=ON
      -DA3D_BUILD_GLFW=ON
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /usr/bin/cmake --build . --target install -j4
    - echo "Linux build complete."

build-macos:
  stage: build
  tags:
    - macos-12.6
  artifacts:
    paths:
      - gitlab-build/packaged
    expire_in: 5 minutes
  script:
    - echo "Starting macOS build..."
    - mkdir gitlab-build
    - cd gitlab-build
    - /opt/local/bin/cmake
      -G"Ninja"
      -DA3D_BUILD_BULLET=ON
      -DA3D_BUILD_GLFW=ON
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - /opt/local/bin/cmake --build . --target install -j4
    - echo "macOS build complete."

build-windows:
  stage: build
  tags:
    - windows-10
  artifacts:
    paths:
      - gitlab-build/packaged
    expire_in: 5 minutes
  script:
    - echo "Starting Windows build..."
    - tar --version
    - mkdir gitlab-build
    - cd gitlab-build
    - cmake
      -T"ClangCL"
      -DA3D_BUILD_BULLET=ON
      -DA3D_BUILD_GLFW=ON
      -DGITLAB_CI_PIPELINE_CREATED_AT="${CI_PIPELINE_CREATED_AT}"
      -DGITLAB_CI_PIPELINE_IID="${CI_PIPELINE_IID}"
      ..
    - cmake --build . --target install -j8
    - echo "Windows build complete."

